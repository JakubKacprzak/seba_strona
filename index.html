0;font-family:var(--d);font-size:clamp(2.35rem,11cqw,4.9rem);line-height:0.94;letter-spacing:-0.035em;text-transform:uppercase;text-wrap:balance\">Ciężar nie negocjuje. Ty też nie musisz.<\u002Fh1>\n      <p style=\"margin:0;max-width:62ch;font-size:clamp(1.02rem,3.6vw,1.16rem);line-height:1.7;color:var(--fg2)\">Prowadzę ludzi, którzy chcą wejść pod sztangę i zostać tam dłużej niż jeden sezon. Startuję sam, więc wiem, ile kosztuje forma, redukcja i powrót po kontuzji. Bez skrótów, bez obietnic, których nie da się utrzymać.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a class=\"cta-solid\" href=\"#kontakt\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;background:var(--inv-bg);color:var(--inv-fg);border:2px solid var(--inv-bg);border-radius:2px;padding:17px 26px\">Zacznij współpracę<\u002Fa>\n        <a class=\"cta-outline\" href=\"#oferta\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:17px 26px\">Oferta<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;border-top:1px solid var(--line);min-height:58vh;background:var(--bg2)\">\n      <img src=\"assets/hero.jpg\" alt=\"Sebastian Krawczyk podczas startu w trójboju siłowym\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n      <span style=\"position:absolute;left:0;bottom:0;pointer-events:none;font-family:var(--m);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;background:var(--bg);color:var(--fg2);border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px\">Sezon startowy · trening w cyklu siłowym<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"o-mnie\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;display:grid;gap:var(--grid-gap);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm)\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">01 · O mnie<\u002Fspan>\n        <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.8vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Startuję, więc nie zgaduję<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:24px;max-width:65ch\">\n        <p style=\"margin:0;font-size:1.05rem;line-height:1.75;color:var(--fg2)\">Zacząłem od trójboju: przysiad, wyciskanie, martwy ciąg. Kulturystyka przyszła później i zmusiła mnie do nauki tego, czego siła nie wymaga: cierpliwości przy redukcji, kontroli objętości, uczciwego liczenia jedzenia. Startuję w obu formatach i każdy blok przygotowań przechodzę na własnym ciele przed tym, zanim wpiszę go komukolwiek do planu.<\u002Fp>\n        <p style=\"margin:0;font-size:1.05rem;line-height:1.75;color:var(--fg2)\">Pracuję z osobami początkującymi i z zawodnikami przed startem. Ten sam sposób prowadzenia: jasny cel, mierzalny postęp, decyzje podejmowane na danych z treningu, a nie na nastroju.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:var(--maxw);margin:clamp(48px,5vw,76px) auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))\">\n      <div style=\"border-top:2px solid var(--fg);padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:var(--m);font-size:12px;letter-spacing:0.16em;color:var(--fg2)\">01<\u002Fspan>\n        <span style=\"font-family:var(--d);font-size:1.15rem;letter-spacing:-0.03em;text-transform:uppercase\">Wytrwałość<\u002Fspan>\n        <span style=\"font-size:0.95rem;line-height:1.68;color:var(--fg2)\">Progres liczy się w latach, nie w tygodniach. Plan ma przetrwać gorszy miesiąc.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line);padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:var(--m);font-size:12px;letter-spacing:0.16em;color:var(--fg2)\">02<\u002Fspan>\n        <span style=\"font-family:var(--d);font-size:1.15rem;letter-spacing:-0.03em;text-transform:uppercase\">Technika<\u002Fspan>\n        <span style=\"font-size:0.95rem;line-height:1.68;color:var(--fg2)\">Ciężar dokładamy dopiero wtedy, gdy ruch wygląda tak samo w pierwszej i ostatniej serii.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line);padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:var(--m);font-size:12px;letter-spacing:0.16em;color:var(--fg2)\">03<\u002Fspan>\n        <span style=\"font-family:var(--d);font-size:1.15rem;letter-spacing:-0.03em;text-transform:uppercase\">Ryzyko<\u002Fspan>\n        <span style=\"font-size:0.95rem;line-height:1.68;color:var(--fg2)\">Start to decyzja. Przygotowuję do niej świadomie, z pełną informacją o kosztach.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line);padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:var(--m);font-size:12px;letter-spacing:0.16em;color:var(--fg2)\">04<\u002Fspan>\n        <span style=\"font-family:var(--d);font-size:1.15rem;letter-spacing:-0.03em;text-transform:uppercase\">Uczciwość<\u002Fspan>\n        <span style=\"font-size:0.95rem;line-height:1.68;color:var(--fg2)\">Mówię, kiedy czegoś nie wiem i kiedy cel jest poza zasięgiem w podanym czasie.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:var(--maxw);margin:clamp(48px,5vw,76px) auto 0\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">Galeria · trening i przygotowania<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <button class=\"gal-btn\" type=\"button\" sc-camel-on-click=\"{{ galeriaWstecz }}\" aria-label=\"Poprzednie zdjęcia\" aria-controls=\"galeria-pasek\"><svg sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M10 2 L4 8 L10 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button class=\"gal-btn\" type=\"button\" sc-camel-on-click=\"{{ galeriaDalej }}\" aria-label=\"Następne zdjęcia\" aria-controls=\"galeria-pasek\"><svg sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M6 2 L12 8 L6 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"galeria-pasek\" style=\"display:flex;gap:1px;overflow-x:auto;padding-bottom:6px;background:var(--bg2);border-bottom:1px solid var(--line)\">\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g6.jpg\" alt=\"Martwy ciąg ze sztangą obciążoną talerzami 10 i 20 kg, dolna faza ruchu\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g2.jpg\" alt=\"Wyciskanie leżąc w Just Gym Radom, sztanga z talerzami 20 kg nad klatką\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g9.jpg\" alt=\"Seria ze sztangą na siłowni, w tle regał z hantlami\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g5.jpg\" alt=\"Dipy na poręczy z obciążeniem na pasie\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g7.jpg\" alt=\"Wyciąg z liną, przyciąganie w pozycji stojącej\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g1.jpg\" alt=\"Sylwetka po treningu, ujęcie w szatni siłowni\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g4.jpg\" alt=\"Pozowanie kontrolne przed lustrem w szatni\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n        <figure class=\"galeria-kafel\" style=\"flex:none;margin:0;width:min(300px,74vw);background:var(--bg2)\">\n          <img src=\"assets/g8.jpg\" alt=\"Plecy w napięciu, kontrola sylwetki w okresie przygotowań\" loading=\"lazy\" decoding=\"async\" style=\"display:block;width:100%;height:clamp(300px,42vh,400px);object-fit:cover\"><\u002Ffigure>\n      <\u002Fdiv>\n      <span style=\"display:block;margin-top:14px;font-family:var(--m);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">Przewiń w bok · zdjęcia z treningów i przygotowań startowych<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"osiagniecia\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter);background:var(--bg2)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;width:100%;min-width:0\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm);container-type:inline-size;min-width:0\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">02 · Osiągnięcia<\u002Fspan>\n        <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.6vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Liczby, nie obietnice<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(44px,4.6vw,68px);position:relative\"><div class=\"progress-bar\"><div class=\"progress-fill\"><\u002Fdiv><\u002Fdiv><div class=\"stats-grid\" style=\"display:flex\">\n        <div style=\"flex:1;min-width:0;padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:12px\">\n          <span class=\"stat-value\" data-stat=\"lata_treningu\" style=\"font-family:var(--m);font-size:clamp(2.2rem,6vw,3.8rem);line-height:0.95;letter-spacing:-0.04em;color:var(--fg)\">00<\u002Fspan>\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2);line-height:1.6\">Lata treningu<span class=\"stat-todo\"><br>[ do uzupełnienia ]<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:12px\">\n          <span class=\"stat-value\" data-stat=\"starty\" style=\"font-family:var(--m);font-size:clamp(2.2rem,6vw,3.8rem);line-height:0.95;letter-spacing:-0.04em;color:var(--fg)\">00<\u002Fspan>\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2);line-height:1.6\">Starty · kulturystyka / trójbój<span class=\"stat-todo\"><br>[ do uzupełnienia ]<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:12px\">\n          <span class=\"stat-value\" data-stat=\"rekordy_zyciowe\" style=\"font-family:var(--m);font-size:clamp(2.2rem,6vw,3.8rem);line-height:0.95;letter-spacing:-0.04em;color:var(--fg)\">000<\u002Fspan>\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2);line-height:1.6\">Rekordy życiowe: przysiad / wyciskanie / martwy ciąg (kg)<span class=\"stat-todo\"><br>[ do uzupełnienia ]<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding:24px 28px 34px 0;display:flex;flex-direction:column;gap:12px\">\n          <span class=\"stat-value\" data-stat=\"podopieczni\" style=\"font-family:var(--m);font-size:clamp(2.2rem,6vw,3.8rem);line-height:0.95;letter-spacing:-0.04em;color:var(--fg)\">00<\u002Fspan>\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2);line-height:1.6\">Prowadzeni podopieczni<span class=\"stat-todo\"><br>[ do uzupełnienia ]<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"oferta\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter);background:var(--bg2)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(38px,4vw,56px)\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm)\">\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">03 · Oferta<\u002Fspan>\n          <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.8vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Co możesz kupić<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#kontakt\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg);border-bottom:2px solid var(--accent);padding-bottom:4px\">Zapytaj o wycenę →<\u002Fa>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:0;padding:0;display:grid\">\n        <li class=\"oferta-wiersz\" style=\"border-top:2px solid var(--fg);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px;padding:28px 0\">\n          <span style=\"font-family:var(--d);font-size:clamp(1.25rem,4.6vw,1.85rem);letter-spacing:-0.035em;text-transform:uppercase\">Plany treningowe<\u002Fspan>\n          <span style=\"font-size:0.98rem;line-height:1.68;color:var(--fg2);max-width:52ch\">Cykl pisany pod twój sprzęt, staż i liczbę dni w tygodniu. Progresja rozpisana do końca bloku.<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:6px;align-self:center\"><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg)\">od 150–300 zł<\u002Fspan><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">Plan indywidualny<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li class=\"oferta-wiersz\" style=\"border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px;padding:28px 0\">\n          <span style=\"font-family:var(--d);font-size:clamp(1.25rem,4.6vw,1.85rem);letter-spacing:-0.035em;text-transform:uppercase\">Plany dietetyczne<\u002Fspan>\n          <span style=\"font-size:0.98rem;line-height:1.68;color:var(--fg2);max-width:52ch\">Masa, redukcja albo przygotowanie startowe. Jedzenie, które da się kupić i ugotować.<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:6px;align-self:center\"><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg)\">od 150–300 zł<\u002Fspan><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">Plan indywidualny<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li class=\"oferta-wiersz\" style=\"border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px;padding:28px 0\">\n          <span style=\"font-family:var(--d);font-size:clamp(1.25rem,4.6vw,1.85rem);letter-spacing:-0.035em;text-transform:uppercase\">Ebooki<\u002Fspan>\n          <span style=\"font-size:0.98rem;line-height:1.68;color:var(--fg2);max-width:52ch\">Podstawy techniki w trzech bojach i prowadzenie redukcji. Do pobrania od razu.<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:6px;align-self:center\"><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg)\">od 39 zł<\u002Fspan><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">PDF<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n        <li class=\"oferta-wiersz\" style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 32px;padding:28px 0\">\n          <span style=\"font-family:var(--d);font-size:clamp(1.25rem,4.6vw,1.85rem);letter-spacing:-0.035em;text-transform:uppercase\">Coaching<\u002Fspan>\n          <span style=\"font-size:0.98rem;line-height:1.68;color:var(--fg2);max-width:52ch\">Online z korektą techniki z wideo albo stacjonarnie w Just Gym Radom. Stały kontakt między treningami.<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:6px;align-self:center\"><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg)\">od 300 zł / mies.<\u002Fspan><span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">1 / 3 / 6 MIES.<\u002Fspan><\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n      <span style=\"display:block;margin-top:18px;font-family:var(--m);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg2);line-height:1.6\">Ceny orientacyjne. Finalna wycena ustalana indywidualnie po kontakcie<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"silownia\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;display:grid;gap:var(--grid-gap);grid-template-columns:repeat(auto-fit,minmax(320px,1fr))\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--stack-md);container-type:inline-size;min-width:0\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">04 · Siłownia partnerska<\u002Fspan>\n        <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.6vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Miejsce na sesje stacjonarne<\u002Fh2>\n        <p style=\"margin:0;max-width:62ch;font-size:1.02rem;line-height:1.75;color:var(--fg2)\">Sesje 1:1 prowadzę w Just Gym Radom. Pełny sprzęt do trójboju: monolift, ławki, platformy do martwego ciągu, wolne ciężary bez limitu obciążenia. Bez muzyki na cały regulator i bez kolejki do stojaka.<\u002Fp>\n        <div style=\"display:grid\">\n          <div style=\"border-top:2px solid var(--fg);padding:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 20px\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2)\">Dostęp<\u002Fspan>\n            <span style=\"font-size:0.98rem;line-height:1.68\">Czynne całą dobę, 7 dni w tygodniu<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 20px\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg2)\">Telefon<\u002Fspan>\n            <span style=\"font-size:0.98rem;line-height:1.68;color:var(--fg2)\">[ do uzupełnienia ]<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a class=\"cta-outline\" href=\"#kontakt\" style=\"align-self:flex-start;font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:17px 26px;min-height:48px;display:inline-flex;align-items:center\">Umów sesję stacjonarną<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"position:relative;min-height:52vh;background:var(--bg2);border:1px solid var(--line)\">\n        <iframe title=\"Just Gym Radom, mapa dojazdu\" src=\"https://www.google.com/maps?q=Just+Gym+Radom,+Andrzeja+Struga+73,+26-600+Radom&amp;z=16&amp;output=embed\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\" style=\"display:block;width:100%;height:100%;min-height:52vh;border:0\"><\u002Fiframe>\n        <span style=\"position:absolute;left:0;bottom:0;pointer-events:none;font-family:var(--m);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;background:var(--bg);color:var(--fg2);border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px\">Just Gym Radom · Galeria Nad Potokiem<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"metoda\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;display:grid;gap:var(--grid-gap);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm)\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">05 · Metoda<\u002Fspan>\n        <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.8vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Jak to wygląda<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"metoda-kroki\" style=\"display:grid\">\n        <div style=\"padding:24px 0;display:flex;gap:var(--stack-sm)\"><span style=\"font-family:var(--m);font-size:12px;color:var(--fg2);min-width:32px\">A<\u002Fspan><p style=\"margin:0;font-size:1.02rem;line-height:1.75;max-width:60ch\">Zaczynamy od tego, co potrafisz dzisiaj: wideo z trzech ćwiczeń i rozmowa. Bez ankiety na dwadzieścia pytań.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid var(--line);padding:24px 0;display:flex;gap:var(--stack-sm)\"><span style=\"font-family:var(--m);font-size:12px;color:var(--fg2);min-width:32px\">B<\u002Fspan><p style=\"margin:0;font-size:1.02rem;line-height:1.75;max-width:60ch\">Dostajesz blok treningowy z jasnym celem i zasadą progresji. Wiesz, po co robisz każdą serię.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid var(--line);padding:24px 0;display:flex;gap:var(--stack-sm)\"><span style=\"font-family:var(--m);font-size:12px;color:var(--fg2);min-width:32px\">C<\u002Fspan><p style=\"margin:0;font-size:1.02rem;line-height:1.75;max-width:60ch\">Raz w tygodniu przeglądamy zapisy z treningów i wideo. Zmiany wprowadzam wtedy, gdy dane je uzasadniają.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid var(--line);padding:24px 0;display:flex;gap:var(--stack-sm)\"><span style=\"font-family:var(--m);font-size:12px;color:var(--fg2);min-width:32px\">D<\u002Fspan><p style=\"margin:0;font-size:1.02rem;line-height:1.75;max-width:60ch\">Po bloku podsumowanie: co zadziałało, co zostawiamy, co idzie do kosza. Potem kolejny cykl.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showSocialProof }}\" hint-placeholder-val=\"{{ false }}\">\n    <section id=\"opinie\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) 0\">\n      <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm);flex:1 1 320px;container-type:inline-size\">\n          <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">06 · Opinie<\u002Fspan>\n          <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.6vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Zrzuty bez retuszu<\u002Fh2>\n        <\u002Fdiv>\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2);max-width:34ch;line-height:1.6;border-bottom:2px solid var(--accent);padding-bottom:6px\">Rozmowy z klientami, publikowane za ich zgodą<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(36px,3.8vw,52px);display:flex;gap:1px;overflow-x:auto;padding:0 var(--gutter) 6px;border-top:2px solid var(--fg);border-bottom:1px solid var(--line);background:var(--bg2)\">\n        <div style=\"flex:none;width:min(360px,80vw);height:520px;background:var(--bg2);border-right:1px solid var(--line)\">\n          <image-slot id=\"opinia-1\" shape=\"rect\" fit=\"cover\" placeholder=\"ZRZUT ROZMOWY 1 · DO UZUPEŁNIENIA\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"flex:none;width:min(360px,80vw);height:520px;background:var(--bg2);border-right:1px solid var(--line)\">\n          <image-slot id=\"opinia-2\" shape=\"rect\" fit=\"cover\" placeholder=\"ZRZUT ROZMOWY 2 · DO UZUPEŁNIENIA\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"flex:none;width:min(360px,80vw);height:520px;background:var(--bg2);border-right:1px solid var(--line)\">\n          <image-slot id=\"opinia-3\" shape=\"rect\" fit=\"cover\" placeholder=\"ZRZUT ROZMOWY 3 · DO UZUPEŁNIENIA\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"display:block;max-width:var(--maxw);margin:14px auto 0;padding:0 var(--gutter);font-family:var(--m);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">[ Placeholder ] Miejsca na zrzuty rozmów, do wypełnienia realnymi materiałami za zgodą klientów<\u002Fspan>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"faq\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto\">\n      <div style=\"display:flex;flex-direction:column;gap:var(--stack-sm);margin-bottom:clamp(36px,3.8vw,52px)\">\n        <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">07 · FAQ<\u002Fspan>\n        <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(1.85rem,4.6vw,3.3rem);line-height:0.98;letter-spacing:-0.04em;text-transform:uppercase\">Zanim napiszesz<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid\">\n        <details style=\"border-top:2px solid var(--fg);padding:26px 0\">\n          <summary style=\"font-family:var(--d);font-size:clamp(1.05rem,3.6vw,1.45rem);letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;line-height:1.2\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;color:var(--fg2);flex:none\">01<\u002Fspan>\n            <span>Jak wygląda pierwszy kontakt?<\u002Fspan>\n            <svg class=\"faq-chevron\" viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 6 L8 11 L13 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fsummary>\n          <p style=\"margin:16px 0 0 38px;font-family:var(--b);font-size:1rem;line-height:1.75;color:var(--fg2);max-width:62ch\">Piszesz na Instagramie, mailem albo dzwonisz. Pytam o staż, cel i dostęp do sprzętu, proszę o wideo z trzech ćwiczeń. Na tej podstawie mówię, co realnie da się zrobić.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top:1px solid var(--line);padding:26px 0\">\n          <summary style=\"font-family:var(--d);font-size:clamp(1.05rem,3.6vw,1.45rem);letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;line-height:1.2\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;color:var(--fg2);flex:none\">02<\u002Fspan>\n            <span>Ile trwa przygotowanie planu treningowego / dietetycznego?<\u002Fspan>\n            <svg class=\"faq-chevron\" viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 6 L8 11 L13 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fsummary>\n          <p style=\"margin:16px 0 0 38px;font-family:var(--b);font-size:1rem;line-height:1.75;color:var(--fg2);max-width:62ch\">Zwykle kilka dni roboczych od momentu, gdy mam wszystkie informacje i wideo. Termin potwierdzam przed startem.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top:1px solid var(--line);padding:26px 0\">\n          <summary style=\"font-family:var(--d);font-size:clamp(1.05rem,3.6vw,1.45rem);letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;line-height:1.2\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;color:var(--fg2);flex:none\">03<\u002Fspan>\n            <span>Czy sesje stacjonarne odbywają się tylko w Just Gym Radom?<\u002Fspan>\n            <svg class=\"faq-chevron\" viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 6 L8 11 L13 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fsummary>\n          <p style=\"margin:16px 0 0 38px;font-family:var(--b);font-size:1rem;line-height:1.75;color:var(--fg2);max-width:62ch\">Tak, tam mam pełny sprzęt do trójboju i stały dostęp. Poza Radomiem prowadzę wyłącznie online.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top:1px solid var(--line);padding:26px 0\">\n          <summary style=\"font-family:var(--d);font-size:clamp(1.05rem,3.6vw,1.45rem);letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;line-height:1.2\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;color:var(--fg2);flex:none\">04<\u002Fspan>\n            <span>Jak wygląda rozliczenie i płatność?<\u002Fspan>\n            <svg class=\"faq-chevron\" viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 6 L8 11 L13 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fsummary>\n          <p style=\"margin:16px 0 0 38px;font-family:var(--b);font-size:1rem;line-height:1.75;color:var(--fg2);max-width:62ch\">Przelew z góry za dany okres współpracy. Szczegóły i kwotę ustalamy przed rozpoczęciem, bez ukrytych dopłat.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0\">\n          <summary style=\"font-family:var(--d);font-size:clamp(1.05rem,3.6vw,1.45rem);letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;line-height:1.2\">\n            <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;color:var(--fg2);flex:none\">05<\u002Fspan>\n            <span>Czy mogę zmienić pakiet coachingu w trakcie współpracy?<\u002Fspan>\n            <svg class=\"faq-chevron\" viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><path d=\"M3 6 L8 11 L13 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fsummary>\n          <p style=\"margin:16px 0 0 38px;font-family:var(--b);font-size:1rem;line-height:1.75;color:var(--fg2);max-width:62ch\">Tak, między blokami treningowymi. Zmianę rozliczamy od kolejnego okresu.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"kontakt\" style=\"border-bottom:1px solid var(--line);padding:var(--sec-y) var(--gutter);background:var(--bg2)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:34px;container-type:inline-size;min-width:0\">\n      <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg2)\">08 · Kontakt<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--d);font-size:clamp(2.1rem,7.4cqw,4.5rem);overflow-wrap:break-word;line-height:0.96;letter-spacing:-0.035em;text-transform:uppercase;max-width:22ch;text-wrap:balance\">Napisz, co chcesz podnieść. Odpowiem konkretnie.<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a class=\"cta-solid\" href=\"https://instagram.com/seba_krawczyk_\" target=\"_blank\" rel=\"noopener\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;background:var(--inv-bg);color:var(--inv-fg);border:2px solid var(--inv-bg);border-radius:2px;padding:18px 28px;min-height:48px;display:inline-flex;align-items:center\">Napisz na Instagramie<\u002Fa>\n        <a class=\"cta-outline\" href=\"mailto:kontakt@sebakrawczyk.pl\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:18px 28px;min-height:48px;display:inline-flex;align-items:center\">Napisz e-mail<\u002Fa>\n        <a class=\"cta-outline\" href=\"tel:+48XXXXXXXXX\" style=\"font-family:var(--m);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:18px 28px;min-height:48px;display:inline-flex;align-items:center\">Zadzwoń<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"font-family:var(--m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2)\">Odpowiadam w ciągu 24 godzin w dni robocze<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection><\u002Fmain>\n\n  <footer style=\"padding:clamp(52px,5vw,72px) var(--gutter) clamp(56px,5vw,76px)\">\n    <div style=\"max-width:var(--maxw);margin:0 auto;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));font-family:var(--m);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg2)\">\n      <span>sebakrawczyk.pl&nbsp;<span style=\"letter-spacing: 1.1px; text-align: right;\">© 2026<\u002Fspan><br><\u002Fspan>\n      <span style=\"text-align: right\"><a href=\"polityka-prywatnosci.html\">POLITYKA PRYWATNOŚCI<\u002Fa> · <a href=\"llms.txt\">LLMS.TXT<\u002Fa><\u002Fspan>\n      <span style=\"display:flex;gap:14px;justify-content:flex-end\"><a href=\"https://instagram.com/seba_krawczyk_\" target=\"_blank\" rel=\"noopener\">INSTAGRAM<\u002Fa><a href=\"https://www.tiktok.com/@seba_motivator\" target=\"_blank\" rel=\"noopener\">TIKTOK<\u002Fa><\u002Fspan>\n      \n    <\u002Fdiv>\n  <\u002Ffooter>\n  <sc-if value=\"{{ showScrollTop }}\" hint-placeholder-val=\"{{ false }}\">\n    <button type=\"button\" class=\"cta-solid scroll-top\" sc-camel-on-click=\"{{ scrollTop }}\" aria-label=\"Wróć na górę strony\" style=\"position:fixed;bottom:24px;right:24px;z-index:20;width:44px;height:44px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);border:2px solid var(--inv-bg);cursor:pointer;display:flex;align-items:center;justify-content:center\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\" style=\"display:block\">\n        <path d=\"M8 14 V3 M3 8 L8 3 L13 8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Motyw&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;#D6D6D6&quot;,&quot;#C2451E&quot;,&quot;#7A8B2E&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motyw&quot;},&quot;glassyNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Nawigacja&quot;},&quot;showSocialProof&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sekcje&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: null, showScrollTop: false, menuOpen: false };\n\n  componentDidMount() {\n    const saved = (() => { try { return localStorage.getItem('sf-theme'); } catch (e) { return null; } })();\n    const t = saved || this.props.defaultTheme || 'dark';\n    this.applyTheme(t);\n    this.setState({ theme: t });\n    this.applyAccent();\n    this.applyGlass();\n    /* Przycisk „do góry” pojawia się dopiero, gdy header (#gora) zjedzie\n       całkiem ponad górną krawędź okna. */\n    this._onScroll = () => {\n      const hero = document.getElementById('gora');\n      const show = hero\n        ? hero.getBoundingClientRect().bottom <= 0\n        : window.scrollY > window.innerHeight;\n      if (show !== this.state.showScrollTop) {\n        this.setState({ showScrollTop: show });\n        this.animujScrollTop();\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    this.setMenu(false);\n    this.initReveal();\n    this.initFaqAccordion();\n    this.initStats();\n    this.initMetoda();\n    this._onKeydown = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setMenu(false); };\n    this._onResize = () => { if (window.innerWidth > 1039 && this.state.menuOpen) this.setMenu(false); };\n    window.addEventListener('keydown', this._onKeydown);\n    window.addEventListener('resize', this._onResize);\n  }\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._ramkaScrollTop) cancelAnimationFrame(this._ramkaScrollTop);\n    if (this._galRaf) cancelAnimationFrame(this._galRaf);\n    if (this._onStatsScroll) window.removeEventListener('scroll', this._onStatsScroll);\n    if (this._statsCleanup) this._statsCleanup();\n    if (this._statsRaf) cancelAnimationFrame(this._statsRaf);\n    if (this._onMetodaScroll) window.removeEventListener('scroll', this._onMetodaScroll);\n    if (this._metodaRaf) cancelAnimationFrame(this._metodaRaf);\n    if (this._onKeydown) window.removeEventListener('keydown', this._onKeydown);\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this._io) this._io.disconnect();\n    if (this._faqCleanup) this._faqCleanup();\n    this.setMenu(false);\n  }\n  /* Wjazd bloków przy scrollu. Klasy dokładam z JS, żeby nie znaczyć ręcznie\n     kilkudziesięciu elementów w szablonie. Bez klasy .reveal treść jest\n     normalnie widoczna, więc brak IntersectionObserver niczego nie ukrywa. */\n  initReveal() {\n    if (!('IntersectionObserver' in window)) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    const kandydaci = [...document.querySelectorAll('section > div > *')];\n    const zbior = new Set(kandydaci);\n    // element, który ma odsłanianego przodka, odpada — inaczej dwie\n    // przezroczystości nakładałyby się na siebie\n    const wierzchnie = kandydaci.filter((el) => {\n      for (let p = el.parentElement; p; p = p.parentElement) {\n        if (zbior.has(p)) return false;\n      }\n      return true;\n    });\n    // siatkę z kilkoma kaflami rozbijam na kafle, żeby wjeżdżały po kolei\n    const cele = [...new Set(wierzchnie.flatMap((el) => {\n      const dzieci = [...el.children];\n      return getComputedStyle(el).display === 'grid' && dzieci.length > 2\n        ? dzieci\n        : [el];\n    }))];\n\n    // To, co widać zaraz po wejściu, zostaje widoczne: nie ma mrugnięcia\n    // i nie opóźniamy LCP. Chowamy wyłącznie bloki poniżej pierwszego ekranu.\n    const prog = window.innerHeight * 0.9;\n    const ukryte = cele.filter((el) => el.getBoundingClientRect().top >= prog);\n\n    // Obserwator powstaje ZANIM cokolwiek zniknie. Gdyby konstruktor rzucił,\n    // treść zostaje po prostu widoczna, zamiast zniknąć bez szansy na powrót.\n    this._io = new IntersectionObserver((wpisy) => {\n      wpisy.forEach((w) => {\n        if (!w.isIntersecting) return;\n        w.target.classList.add('reveal-on');\n        this._io.unobserve(w.target);\n      });\n    }, { rootMargin: '0px 0px -10% 0px' });\n\n    ukryte.forEach((el) => {\n      el.classList.add('reveal', 'reveal-init');\n      this._io.observe(el);\n    });\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      ukryte.forEach((el) => el.classList.remove('reveal-init'));\n    }));\n  }\n  /* Rozwijanie FAQ animowane przez WAAPI, ale nie na wysokosci <details> -\n     height to wlasciwosc layoutu, wiec kazda klatka wymagalaby przeliczenia\n     reflow na glownym watku (na wolniejszym CPU - np. telefon w trybie\n     oszczedzania baterii - bylo to widocznie niepłynne). <details> przelacza\n     [open] od razu, natywnie, bez animacji, a animuje sie tylko opacity i\n     transform samej odpowiedzi - obie te wlasciwosci licza sie w calosci na\n     kompozytorze/GPU, wiec CPU nie ma tu juz nic do policzenia. Koszt: reszta\n     strony pod danym pytaniem przesuwa sie od razu (skok), zamiast plynnie\n     \"rozwijac miejsce\" razem z trescia - swiadomy kompromis na rzecz\n     plynnosci, kosztem ciaglosci wysokosci. */\n  initFaqAccordion() {\n    const wszystkie = [...document.querySelectorAll('#faq details')];\n    if (!wszystkie.length) return;\n    // Chevron przelacza sie na klase .faq-open dopiero gdy ten kod wystartuje —\n    // bez niego obrotem steruje natywny [open] i wszystko dziala tak samo.\n    const sekcjaFaq = document.getElementById('faq');\n    if (sekcjaFaq) sekcjaFaq.classList.add('faq-js');\n    const zredukowany = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const sluchacze = wszystkie.map((det) => {\n      const podsumowanie = det.querySelector('summary');\n      const odpowiedz = det.querySelector('p');\n      let animacja = null;\n      let zamyka = false;\n      let ramka = null;\n      const naKlik = (e) => {\n        e.preventDefault();\n        if (ramka) { cancelAnimationFrame(ramka); ramka = null; }\n        if (animacja) animacja.cancel();\n        if (det.open && !zamyka) {\n          zamyka = true;\n          det.classList.remove('faq-open');\n          if (zredukowany || !odpowiedz) { det.open = false; zamyka = false; return; }\n          // Startowa nieprzezroczystosc z aktualnego stanu, nie na sztywno 1 -\n          // przy szybkim otwarciu i zamknieciu pod rzad odpowiedz moglaby byc\n          // w trakcie dogrywania fade-in, wiec realnie widoczna wartosc bywa inna.\n          const od = getComputedStyle(odpowiedz).opacity;\n          animacja = odpowiedz.animate(\n            { opacity: [od, 0], transform: ['translateY(0)', 'translateY(-6px)'] },\n            { duration: 160, easing: 'ease' }\n          );\n          animacja.onfinish = () => {\n            det.open = false;\n            zamyka = false;\n            animacja = null;\n            odpowiedz.style.opacity = '';\n          };\n          animacja.oncancel = () => { zamyka = false; };\n        } else {\n          zamyka = false;\n          det.open = true;\n          det.classList.add('faq-open');\n          if (zredukowany || !odpowiedz) return;\n          // Zerowa nieprzezroczystosc od razu, zeby tresc nie mignela na pelnej\n          // widocznosci przez te jedna klatke, zanim animacja zdazy ja przejac.\n          odpowiedz.style.opacity = '0';\n          ramka = requestAnimationFrame(() => {\n            ramka = null;\n            animacja = odpowiedz.animate(\n              { opacity: [0, 1], transform: ['translateY(-6px)', 'translateY(0)'] },\n              { duration: 200, easing: 'ease' }\n            );\n            animacja.onfinish = () => { animacja = null; odpowiedz.style.opacity = ''; };\n          });\n        }\n      };\n      podsumowanie.addEventListener('click', naKlik);\n      return () => {\n        podsumowanie.removeEventListener('click', naKlik);\n        if (ramka) cancelAnimationFrame(ramka);\n        if (animacja) animacja.cancel();\n      };\n    });\n    this._faqCleanup = () => {\n      sluchacze.forEach((sprzataj) => sprzataj());\n      if (sekcjaFaq) sekcjaFaq.classList.remove('faq-js');\n      wszystkie.forEach((det) => det.classList.remove('faq-open'));\n    };\n  }\n  /* Liczby w sekcji Osiągnięcia czytane z osobnego pliku stats.json (siostrzany\n     plik obok index.html) zamiast być wpisane na sztywno w szablonie — tak, żeby\n     dało się je zaktualizować bez grzebania w reszcie strony. Puste pole w JSON-ie\n     zostawia obecny placeholder bez zmian; brak pliku albo błędny JSON też niczego\n     nie psuje, po prostu nic się nie podmienia. */\n  /* Linia w sekcji Metoda dorysowuje sie w miare przewijania bloku krokow.\n     Bez przypinania sekcji (inaczej niz w Osiagnieciach) — tu nie ma licznikow\n     do odczytania, wiec nie ma po co zatrzymywac ekranu. Postep licze od chwili,\n     gdy gora bloku wjedzie na 85% wysokosci okna, do chwili, gdy jego dol minie\n     40% — linia konczy sie wiec razem z ostatnim krokiem, a nie dopiero przy\n     dolnej krawedzi ekranu. Wysokosc okna czytam za kazdym razem, wiec obrot\n     telefonu czy zmiana rozmiaru okna nie wymaga osobnego sluchacza. */\n  initMetoda() {\n    const kroki = document.querySelector('#metoda .metoda-kroki');\n    if (!kroki) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      kroki.style.setProperty('--metoda-postep', '1');\n      return;\n    }\n    const przeliczMetoda = () => {\n      this._metodaRaf = null;\n      const r = kroki.getBoundingClientRect();\n      const vh = window.innerHeight;\n      const start = vh * 0.85;\n      const koniec = vh * 0.40;\n      const zakres = r.height + start - koniec;\n      const postep = zakres > 0 ? Math.min(1, Math.max(0, (start - r.top) / zakres)) : 1;\n      kroki.style.setProperty('--metoda-postep', String(postep));\n    };\n    this._onMetodaScroll = () => {\n      if (this._metodaRaf) return;\n      this._metodaRaf = requestAnimationFrame(przeliczMetoda);\n    };\n    window.addEventListener('scroll', this._onMetodaScroll, { passive: true });\n    przeliczMetoda();\n  }\n  /* Efekt jednorazowy: gdy user schodzi w dol strony i srodek sekcji\n     Osiagniecia mija srodek ekranu, scroll strony sie blokuje (wheel/touch/\n     klawiatura sa przechwytywane, preventDefault), a ten sam ruch napedza\n     pasek postepu i liczniki zamiast przewijac dokument. Po dojsciu paska\n     do 100% blokada znika na stale (this._statsUsed) - kolejne przewijanie\n     w dol i w gore dziala juz zupelnie normalnie, w obie strony, bez\n     ponownego zatrzymania. Scroll W GORE nigdy nie odpala blokady - liczy\n     sie tylko kierunek w dol, wiec efekt nie utrudnia wracania do gory\n     strony (to byl dokladnie problem poprzedniej wersji z position:sticky,\n     ktora blokowala scroll w obie strony na 130vh). Bez zadnej biblioteki\n     (rozwazany byl GSAP ScrollTrigger) - to jeden konkretny efekt, wiec\n     wlasny throttlowany kod wychodzi lzejszy niz ogolna biblioteka. */\n  initStats() {\n    const sekcja = document.getElementById('osiagniecia');\n    if (!sekcja) return;\n    fetch('stats.json')\n      .then((r) => (r.ok ? r.json() : null))\n      .then((dane) => {\n        if (!dane) return;\n        const elementy = [...document.querySelectorAll('.stat-value[data-stat]')]\n          .map((el) => ({ el, cel: Number(dane[el.dataset.stat]) }))\n          .filter((s) => dane[s.el.dataset.stat] && !Number.isNaN(s.cel));\n        if (!elementy.length) return;\n        elementy.forEach((s) => {\n          s.el.textContent = '0';\n          const dopisek = s.el.parentElement.querySelector('.stat-todo');\n          if (dopisek) dopisek.remove();\n        });\n        const pasek = sekcja.querySelector('.progress-fill');\n        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n          if (pasek) pasek.style.transform = 'scaleX(1)';\n          elementy.forEach((s) => { s.el.textContent = String(s.cel); });\n          return;\n        }\n        const rysuj = (postep) => {\n          const skala = 'scaleX(' + postep + ')';\n          if (pasek && pasek.style.transform !== skala) pasek.style.transform = skala;\n          elementy.forEach((s, i) => {\n            const lokalny = Math.min(1, Math.max(0, (postep * 100 - i * 25) / 25));\n            const wartosc = String(Math.round(s.cel * lokalny));\n            if (s.el.textContent !== wartosc) s.el.textContent = wartosc;\n          });\n        };\n        let zablokowany = false;\n        let postep = 0;\n        let zablokowanyScrollY = 0;\n        let dystansCalkowity = 1;\n        let ostatniScrollY = window.scrollY;\n        let dotykY = null;\n        const zaplanujRysunek = () => {\n          if (this._statsRaf) return;\n          this._statsRaf = requestAnimationFrame(() => { this._statsRaf = null; rysuj(postep); });\n        };\n        const dodajPostep = (delta) => {\n          postep = Math.min(1, Math.max(0, postep + delta / dystansCalkowity));\n          zaplanujRysunek();\n          if (postep >= 1) odblokuj();\n        };\n        const naWheel = (e) => {\n          e.preventDefault();\n          let dy = e.deltaY;\n          if (e.deltaMode === 1) dy *= 18;\n          else if (e.deltaMode === 2) dy *= window.innerHeight;\n          dodajPostep(dy);\n        };\n        const naTouchStart = (e) => { dotykY = e.touches[0].clientY; };\n        const naTouchMove = (e) => {\n          if (dotykY == null) return;\n          e.preventDefault();\n          const y = e.touches[0].clientY;\n          dodajPostep(dotykY - y);\n          dotykY = y;\n        };\n        const naKeydown = (e) => {\n          if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'End') {\n            e.preventDefault();\n            dodajPostep(120);\n          } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'Home') {\n            e.preventDefault();\n          }\n        };\n        const odepnijListenery = () => {\n          window.removeEventListener('wheel', naWheel);\n          window.removeEventListener('touchstart', naTouchStart);\n          window.removeEventListener('touchmove', naTouchMove);\n          window.removeEventListener('keydown', naKeydown);\n        };\n        const odblokuj = () => {\n          zablokowany = false;\n          this._statsUsed = true;\n          odepnijListenery();\n        };\n        const zablokuj = () => {\n          zablokowany = true;\n          zablokowanyScrollY = window.scrollY;\n          dystansCalkowity = window.innerHeight * 1.2;\n          window.addEventListener('wheel', naWheel, { passive: false });\n          window.addEventListener('touchstart', naTouchStart, { passive: true });\n          window.addEventListener('touchmove', naTouchMove, { passive: false });\n          window.addEventListener('keydown', naKeydown);\n        };\n        this._onStatsScroll = () => {\n          const y = window.scrollY;\n          if (this._statsUsed) return;\n          if (zablokowany) {\n            /* Siatka bezpieczenstwa: przeciagniecie scrollbara mysza albo\n               scroll spoza wheel/touch/naszej klawiatury omija preventDefault -\n               wracamy na zablokowana pozycje zamiast pozwolic stronie uciec. */\n            if (y !== zablokowanyScrollY) window.scrollTo(0, zablokowanyScrollY);\n            return;\n          }\n          const poprzedni = ostatniScrollY;\n          ostatniScrollY = y;\n          const scrollujeWDol = y > poprzedni;\n          if (!scrollujeWDol) return;\n          /* Skok wiekszy niz jeden ekran (klik w link nawigacji do dalszej\n             sekcji, End, przeciagniecie scrollbara) to nie naturalne\n             przewijanie - lapanie takiego skoku w polowie i zamrazanie\n             strony w przypadkowym miejscu byloby myloce, wiec go pomijamy. */\n          if (y - poprzedni > window.innerHeight) return;\n          const r = sekcja.getBoundingClientRect();\n          if (r.top + r.height / 2 <= window.innerHeight / 2) zablokuj();\n        };\n        window.addEventListener('scroll', this._onStatsScroll, { passive: true });\n        this._statsCleanup = odepnijListenery;\n      })\n      .catch(() => {});\n  }\n  /* Atrybut na <html> steruje i widocznością panelu, i blokadą scrolla —\n     jedno i drugie w CSS-ie, w tym samym breakpoincie. Dzięki temu blokada\n     znika sama przy przejściu na desktop i zdejmuje się synchronicznie,\n     więc kliknięcie w kotwicę od razu przewija stronę. */\n  scrollToTop() {\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n  /* Strzalki galerii przesuwaja pasek o szerokosc jednego kafla (razem z 1px\n     przerwa), a na koncach zawijaja na drugi koniec - inaczej przycisk przy\n     ostatnim zdjeciu nie robilby nic i wygladal na zepsuty. */\n  przesunGalerie(kierunek) {\n    const pasek = document.getElementById('galeria-pasek');\n    if (!pasek) return;\n    const kafel = pasek.querySelector('figure');\n    const krok = kafel ? kafel.getBoundingClientRect().width + 1 : pasek.clientWidth * 0.8;\n    const max = Math.max(0, pasek.scrollWidth - pasek.clientWidth);\n    /* Cel trzymam w polu, nie czytam scrollLeft: przy animowanym przewijaniu\n       kolejne klikniecie zlapaloby wartosc z polowy animacji i liczylo krok od\n       zlej bazy. Jesli uzytkownik przewinie pasek sam (palcem, kolkiem),\n       pole rozjezdza sie z rzeczywistoscia, wiec przy braku trwajacej\n       animacji baze biore z realnej pozycji. */\n    const teraz = (window.performance || Date).now();\n    const swiezy = this._galCel != null && teraz - (this._galT || 0) < 700;\n    const baza = swiezy ? this._galCel : pasek.scrollLeft;\n    /* Zawijanie liczone z faktycznego zakresu przewijania, nie z indeksu kafla:\n       ostatnia pozycja rzadko wypada na wielokrotnosc kroku, wiec porownanie\n       indeksow gubilo przeskok z konca na poczatek. */\n    let cel;\n    if (kierunek > 0) cel = baza >= max - 1 ? 0 : Math.min(max, baza + krok);\n    else cel = baza <= 1 ? max : Math.max(0, baza - krok);\n    this._galCel = cel;\n    this._galT = teraz;\n    this.przewinDo(pasek, cel);\n  }\n  /* Wlasny tween na scrollLeft zamiast scrollTo({behavior:'smooth'}) -\n     natywna animacja na tym kontenerze bywa gubiona (zadanie przechodzi,\n     pozycja nie rusza), a przypisanie scrollLeft dziala zawsze. */\n  przewinDo(pasek, cel) {\n    if (this._galRaf) cancelAnimationFrame(this._galRaf);\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      pasek.scrollLeft = cel;\n      return;\n    }\n    const od = pasek.scrollLeft;\n    const dystans = cel - od;\n    if (!dystans) return;\n    const czas = 380;\n    const start = (window.performance || Date).now();\n    const klatka = () => {\n      const t = Math.min(1, ((window.performance || Date).now() - start) / czas);\n      const e = 1 - Math.pow(1 - t, 3);\n      pasek.scrollLeft = od + dystans * e;\n      this._galRaf = t < 1 ? requestAnimationFrame(klatka) : null;\n    };\n    this._galRaf = requestAnimationFrame(klatka);\n  }\n  setMenu(open) {\n    document.documentElement.setAttribute('data-menu', open ? 'on' : 'off');\n    if (open !== this.state.menuOpen) this.setState({ menuOpen: open });\n  }\n  /* Przycisk \"do gory\" wstawia i usuwa <sc-if>, wiec samo CSS nie wystarczy:\n     swiezo zamontowany element od razu ma stan docelowy i tranzycja nie ma od\n     czego wystartowac. Klase dokladam dopiero po klatce - wtedy przegladarka\n     zdazyla policzyc stan poczatkowy (opacity 0, scale .8) i animuje przejscie.\n     Podwojny rAF z tego samego powodu co w initReveal(): pojedynczy potrafi\n     trafic w te sama recalkulacje stylu, co wstawienie elementu. */\n  animujScrollTop() {\n    if (this._ramkaScrollTop) return;\n    this._ramkaScrollTop = requestAnimationFrame(() => requestAnimationFrame(() => {\n      this._ramkaScrollTop = null;\n      const btn = document.querySelector('.scroll-top');\n      if (btn) btn.classList.add('scroll-top-on');\n    }));\n  }\n  componentDidUpdate(prev) {\n    this.animujScrollTop();\n    if (prev.accentColor !== this.props.accentColor) this.applyAccent();\n    if (prev.glassyNav !== this.props.glassyNav) this.applyGlass();\n  }\n  applyGlass() {\n    const on = this.props.glassyNav ?? true;\n    document.documentElement.setAttribute('data-glass', on ? 'on' : 'off');\n  }\n  applyAccent() {\n    const a = this.props.accentColor;\n    document.documentElement.style.setProperty('--accent', a && a !== 'none' ? a : 'currentColor');\n  }\n  applyTheme(t) {\n    document.documentElement.setAttribute('data-theme', t);\n    /* Pasek Safari/Chrome bierze kolor z meta theme-color. Motyw tej\n       strony siedzi w localStorage, a nie w prefers-color-scheme, więc wariant\n       z atrybutem media by się rozjechał — trzeba przestawiać tag ręcznie. */\n    const bar = document.querySelector('meta[name=\"theme-color\"]');\n    if (bar) bar.setAttribute('content', t === 'light' ? '#F4F5F5' : '#0A0A0A');\n    try { localStorage.setItem('sf-theme', t); } catch (e) {}\n  }\n  renderVals() {\n    const theme = this.state.theme || this.props.defaultTheme || 'dark';\n    return {\n      themeLabel: theme === 'dark' ? 'jasny' : 'ciemny',\n      showSocialProof: this.props.showSocialProof ?? true,\n      showScrollTop: this.state.showScrollTop,\n      themeSwitchLabel: theme === 'dark' ? 'Włącz jasny motyw' : 'Włącz ciemny motyw',\n      menuExpanded: this.state.menuOpen ? 'true' : 'false',\n      menuLabel: this.state.menuOpen ? 'Zamknij menu' : 'Otwórz menu',\n      galeriaWstecz: () => this.przesunGalerie(-1),\n      galeriaDalej: () => this.przesunGalerie(1),\n      toggleMenu: () => this.setMenu(!this.state.menuOpen),\n      closeMenu: () => this.setMenu(false),\n      scrollTop: () => this.scrollToTop(),\n      toggleTheme: () => {\n        const next = theme === 'dark' ? 'light' : 'dark';\n        this.applyTheme(next);\n        this.setState({ theme: next });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
</script>
