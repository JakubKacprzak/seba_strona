  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }

      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);

    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

ble{outline:2px solid var(--accent);outline-offset:2px}\nsummary::-webkit-details-marker{display:none}\n\n/* --- rytm pionowy --- */\nsection,header{scroll-margin-top:calc(var(--nav-h) + 14px)}\np{text-wrap:pretty}\n\n/* --- nawigacja --- */\n.nav-inner{padding:0 var(--edge);min-height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:clamp(20px,3vw,44px)}\n.nav-brand{font-family:var(--d);font-size:15px;letter-spacing:-0.04em;line-height:1;text-transform:uppercase;flex:none}\n.nav-links{display:flex;align-items:center;gap:clamp(18px,2vw,32px);min-width:0}\n.nav-links a{position:relative;font-family:var(--m);font-size:12px;letter-spacing:0.08em;line-height:1;text-transform:uppercase;color:var(--fg2);white-space:nowrap;padding:8px 0;transition:color 180ms ease}\n.nav-links a:hover{color:var(--fg)}\n.nav-links a::after{content:\"\";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;opacity:0;transition:opacity 180ms ease}\n.nav-links a:hover::after{opacity:1}\n.nav-cta{display:flex;align-items:center;gap:clamp(12px,1.4vw,18px);flex:none}\n.nav-contact{display:inline-flex;align-items:center;min-height:42px;border-radius:2px;padding:0 26px;background:var(--inv-bg);color:var(--inv-fg);font-family:var(--m);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;transition:all 180ms ease}\n.nav-contact:hover{color:var(--inv-fg);opacity:0.84;transform:translateY(-2px)}\n\n/* --- przełącznik motywu — ikony Lucide (lucide.dev), licencja ISC --- */\n.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;min-height:42px;flex:none;padding:0;background:transparent;border:none;border-radius:2px;color:var(--fg);cursor:pointer;transition:background-color 180ms ease}\n.theme-btn:hover{background:var(--line)}\n.theme-btn svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.theme-btn .icon-sun,.theme-btn .icon-moon{display:none}\n:root[data-theme=\"dark\"] .theme-btn .icon-sun{display:block}\n:root[data-theme=\"light\"] .theme-btn .icon-moon{display:block}\n\n\n/* --- CTA: wypelnione przyciemniaja sie, obrysowane wypelniaja kolorem.\n   Wczesniej oba typy dziedziczyly z globalnego a:hover{color:fg2} — na\n   przycisku z obrysem to gasilo cala ramke razem z tekstem (--accent jest\n   domyslnie currentColor), wiec hover wygladal jak znikanie, nie zacheta. */\n.cta-solid{transition:all 180ms ease}\n.cta-solid:hover{opacity:.84;transform:translateY(-2px)}\n.cta-solid.scroll-top:hover{transform:scale(1.1) translateY(-5px)}\n/* --- wejscie przycisku \"do gory\". <sc-if> montuje go dopiero po zjechaniu z\n   hero, wiec bez tego wskakiwal skokowo, w pelnym rozmiarze. Stan startowy\n   siedzi na .scroll-top, docelowy na .scroll-top-on dokladanej z JS. Hover\n   (.cta-solid.scroll-top:hover) ma wyzsza specyficznosc, wiec nadal wygrywa. */\n.scroll-top{opacity:0;transform:scale(.8);transition:opacity 200ms ease,transform 240ms cubic-bezier(.2,.7,.3,1)}\n.scroll-top.scroll-top-on{opacity:1;transform:none}\n.cta-outline{color:var(--fg);border:2px solid var(--accent);transition:all 180ms ease}\n.cta-outline:hover{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);transform:translateY(-2px)}\n\n/* --- FAQ: overflow:hidden tylko na czas animacji wysokosci w JS,\n   zeby odpowiedz nie wystawala poza aktualnie animowany rozmiar --- */\n#faq details{overflow:hidden;contain:layout}\n/* --- chevron przy pytaniu: bez niego nic nie sygnalizuje, ze pozycja sie rozwija\n   (natywny marker jest zdjety przez summary::-webkit-details-marker) --- */\n#faq .faq-chevron{margin-left:auto;flex:none;color:var(--fg2);align-self:center;transition:transform 260ms ease}\n/* Bez JS obrotem steruje natywny [open]. */\n#faq:not(.faq-js) details[open] .faq-chevron{transform:rotate(180deg)}\n/* Z JS steruje klasa .faq-open: przy zamykaniu [open] zyje jeszcze do konca\n   animacji wysokosci, wiec chevron wracalby o 260ms za pozno. */\n#faq.faq-js details.faq-open .faq-chevron{transform:rotate(180deg)}\n\n/* --- scroll-reveal (IntersectionObserver + tranzycja, bez bibliotek) --- */\n.reveal{opacity:0;transform:translateY(18px);transition:opacity 600ms ease,transform 600ms cubic-bezier(.2,.7,.3,1)}\n.reveal-on{opacity:1;transform:none}\n/* na jedną klatkę gasi tranzycję: klasa .reveal trafia na już wyrenderowaną\n   treść, więc bez tego blok najpierw widocznie by zanikł */\n.reveal-init{transition:none !important}\n/* schodkowanie przez nth-child, nie przez style inline — React przy przerysowaniu nadpisuje atrybut style, klasy zostawia w spokoju */\n.reveal:nth-child(2){transition-delay:60ms}\n.reveal:nth-child(3){transition-delay:120ms}\n.reveal:nth-child(4){transition-delay:180ms}\n.reveal:nth-child(n+5){transition-delay:240ms}\n\n/* --- pasek postepu w sekcji Osiagniecia, synchronizowany ze scrollem --- */\n.progress-bar{position:absolute;top:0;left:0;right:0;height:2px;background:var(--line)}\n.progress-fill{height:100%;width:100%;transform:scaleX(0);transform-origin:0 0;background:var(--fg)}\n\n/* --- pionowa linia w sekcji Metoda, rysowana scrollem. Ten sam uklad co pasek\n   wyzej: statyczna szyna w --line i biegnaca po niej wypelniacz w --fg, tylko\n   obrocone o 90 stopni. Zrobione na pseudoelementach, nie na dodatkowym <div>,\n   bo initReveal() rozbija te siatke na dzieci i piaty potomek zlapalby klase\n   .reveal — a .reveal-on{transform:none} zbiloby scaleY() linii.\n   Offset -14px trzyma linie poza pudelkiem tresci, wiec ukladu nie rusza:\n   na desktopie wpada w przerwe siatki, na mobile w padding sekcji. */\n#metoda .metoda-kroki{position:relative}\n#metoda .metoda-kroki::before,\n#metoda .metoda-kroki::after{content:\"\";position:absolute;left:-14px;top:0;bottom:0;width:2px}\n#metoda .metoda-kroki::before{background:var(--line)}\n#metoda .metoda-kroki::after{background:var(--fg);transform:scaleY(var(--metoda-postep,0));transform-origin:top center}\n/* --- galeria zdjec w sekcji O mnie --- */\n.gal-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;padding:0;background:transparent;border:2px solid var(--line);border-radius:2px;color:var(--fg);cursor:pointer;transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}\n.gal-btn:hover{border-color:var(--fg);background:var(--bg2);transform:translateY(-2px)}\n.gal-btn svg{display:block;width:16px;height:16px}\n#galeria-pasek{scrollbar-width:none}\n#galeria-pasek::-webkit-scrollbar{display:none}\n@media (prefers-reduced-motion:reduce){.gal-btn{transition:none}}\n.galeria-kafel{position:relative;overflow:hidden}\n.galeria-kafel img{filter:grayscale(1);transition:transform 500ms cubic-bezier(.2,.7,.3,1),filter 400ms ease}\n.galeria-kafel:hover img,.galeria-kafel:focus-within img{transform:scale(1.04);filter:none}\n@media (hover:none){.galeria-kafel img{filter:none}}\n@media (prefers-reduced-motion:reduce){.galeria-kafel img{transition:filter 400ms ease}.galeria-kafel:hover img{transform:none}}\n\n/* --- wiersze oferty: hover przesuwa w prawo --- */\n.oferta-wiersz{transition:transform 200ms ease}\n.oferta-wiersz:hover{transform:translateX(16px)}\n\n/* --- hamburger --- */\n.nav-toggle{display:none;flex-direction:column;align-items:center;justify-content:center;width:44px;min-height:42px;flex:none;padding:0;background:transparent;border:2px solid var(--line);border-radius:2px;color:var(--fg);cursor:pointer;transition:all 180ms ease}\n.nav-toggle:hover{border-color:var(--accent);transform:translateY(-2px)}\n.nav-toggle span{display:block;width:18px;height:2px;background:currentColor;transition:transform 240ms ease,opacity 140ms ease}\n.nav-toggle span + span{margin-top:4px}\n:root[data-menu=\"on\"] .nav-toggle span:nth-child(1){transform:translateY(6px) rotate(45deg)}\n:root[data-menu=\"on\"] .nav-toggle span:nth-child(2){opacity:0}\n:root[data-menu=\"on\"] .nav-toggle span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}\n\n/* --- panel menu mobilnego --- */\n.mobile-menu{display:none;position:fixed;left:0;right:0;top:var(--nav-h);bottom:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;flex-direction:column;justify-content:space-between;padding:clamp(28px,6vw,44px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 32px);opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity 200ms ease,transform 240ms ease,visibility 0s linear 240ms}\n:root[data-menu=\"on\"] .mobile-menu{opacity:1;visibility:visible;transform:none;transition:opacity 200ms ease,transform 240ms ease,visibility 0s}\n.mm-links{display:flex;flex-direction:column}\n.mm-links a{display:flex;align-items:baseline;gap:16px;padding:clamp(14px,2.4vw,20px) 0;border-top:1px solid var(--line);font-family:var(--d);font-size:clamp(1.45rem,7.5vw,2.1rem);line-height:1;letter-spacing:-0.035em;text-transform:uppercase}\n.mm-links a:first-child{border-top:2px solid var(--fg)}\n.mm-links a:last-child{border-bottom:1px solid var(--line)}\n.mm-num{font-family:var(--m);font-size:11px;letter-spacing:0.16em;color:var(--fg2);flex:none}\n.mm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:clamp(32px,6vw,48px)}\n.mm-foot > *{font-family:var(--m);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;border-radius:2px;padding:0 26px;min-height:46px;display:inline-flex;align-items:center}\n.mm-foot .theme-btn{width:46px;min-height:46px;padding:0}\n.mm-note{font-family:var(--m);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg2);margin-top:20px;line-height:1.6}\n\n@media (max-width:1039px){\n  :root{--nav-h:68px}\n  :root[data-menu=\"on\"],:root[data-menu=\"on\"] body{overflow:hidden}\n  .nav-links{display:none}\n  .nav-cta .theme-btn{display:none}\n  .nav-toggle{display:flex;order:3}\n  .nav-contact{order:2}\n  .mobile-menu{display:flex}\n}\n@media (max-width:639px){\n  .nav-inner{gap:12px}\n  .nav-brand{font-size:12px}\n  .nav-cta{gap:8px}\n  .nav-contact{font-size:10px;padding:0 20px;min-height:40px}\n}\n@media (max-width:505px){\n  .stats-grid{display:grid!important;grid-template-columns:1fr}\n}\n@media (max-width:808px){\n  #gora{position:relative}\n  #gora::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:1;pointer-events:none}\n  #gora > div:first-child{position:relative;z-index:2}\n  #gora > div:last-child{position:absolute!important;inset:0!important;min-height:0!important;border-top:none!important;background:none!important}\n  #gora img{z-index:0}\n  #gora > div:last-child span{z-index:2}\n}\n@media (prefers-reduced-motion:reduce){\n  .nav-toggle,.nav-toggle span,.mobile-menu,.nav-contact,.theme-btn,.nav-links a,.cta-solid,.cta-outline{transition-duration:1ms !important}\n  .reveal{opacity:1 !important;transform:none !important;transition:none !important}\n  .scroll-top{opacity:1 !important;transform:none !important;transition-duration:1ms !important}\n  #metoda .metoda-kroki::after{transform:none !important}\n  .faq-chevron{transition-duration:1ms !important}\n  .oferta-wiersz{transition-duration:1ms !important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--bg);color:var(--fg);position:relative;overflow-x:clip\">\n  \n\n  <nav style=\"position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:var(--nav-blur);-webkit-backdrop-filter:var(--nav-blur);border-bottom:1px solid var(--line)\">\n    <div class=\"nav-inner\">\n      <a class=\"nav-brand\" href=\"#gora\">SEBASTIAN KRAWCZYK<\u002Fa>\n      <div class=\"nav-links\">\n        <a href=\"#o-mnie\">O mnie<\u002Fa>\n        <a href=\"#osiagniecia\">Osiągnięcia<\u002Fa>\n        <a href=\"#oferta\">Oferta<\u002Fa>\n        <a href=\"#silownia\">Siłownia<\u002Fa>\n        <a href=\"#metoda\">Metoda<\u002Fa>\n        <a href=\"#opinie\">Opinie<\u002Fa>\n        <a href=\"#faq\">FAQ<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"nav-cta\">\n        <button class=\"theme-btn\" type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"{{ themeSwitchLabel }}\"><svg class=\"icon-sun\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2\"><\u002Fpath><path d=\"m19.07 4.93-1.41 1.41\"><\u002Fpath><path d=\"M20 12h2\"><\u002Fpath><path d=\"m19.07 19.07-1.41-1.41\"><\u002Fpath><path d=\"M12 20v2\"><\u002Fpath><path d=\"m6.34 17.66-1.41 1.41\"><\u002Fpath><path d=\"M2 12h2\"><\u002Fpath><path d=\"m6.34 6.34-1.41-1.41\"><\u002Fpath><\u002Fsvg><svg class=\"icon-moon\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <button class=\"nav-toggle\" type=\"button\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-controls=\"menu-mobilne\" aria-expanded=\"{{ menuExpanded }}\" aria-label=\"{{ menuLabel }}\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n        <a class=\"nav-contact\" href=\"#kontakt\">Kontakt<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <div class=\"mobile-menu\" id=\"menu-mobilne\">\n    <nav class=\"mm-links\" aria-label=\"Menu główne\">\n        <a href=\"#o-mnie\" sc-camel-on-click=\"{{ closeMenu }}\"><span class=\"mm-num\">01<\u002Fspan><span>O mnie<\u002Fspan><\u002Fa>\n        <a href=\"#osiagniecia\" sc-camel-on-click=\"{{ closeMenu }}\"><span class=\"mm-num\">02<\u002Fspan><span>Osiągnięcia<\u002Fspan><\u002Fa>\n        <a href=\"#oferta\" sc-camel-on-click=\"{{ closeMenu }}\"><span class=\"mm-num\">03<\u002Fspan><span>Oferta<\u002Fspan><\u002Fa>\n        <a href=\"#silownia\" sc-camel-on-click=\"{{ closeMenu }}\"><span class=\"mm-num\">04<\u002Fspan><span>Siłownia<\u002Fspan><\u002Fa>\n        <a href=\"#metoda\" sc-camel-on-click=\"{{ closeMenu }}\"><span class=\"mm-num\">05<\u002Fspan><span>Metoda<\u002Fspan><\u002Fa>\n        <a href=\"#opinie\" sc-
